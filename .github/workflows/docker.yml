name: Docker deployment check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the web and API image
        run: docker build -t pantip-demo .
      - name: Start the complete application
        run: docker run -d --name pantip-demo -p 127.0.0.1:8080:10000 pantip-demo
      - name: Verify the saved model and demo analysis
        run: python3 deploy/smoke_test.py http://127.0.0.1:8080
      - name: Show application logs
        if: always()
        run: docker logs pantip-demo || true
